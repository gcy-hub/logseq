<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logseq Knowledge Base</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --panel: #ffffff;
      --line: #e4e7ec;
      --text: #1f2937;
      --muted: #667085;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input { font: inherit; }
    .app { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 100vh; }
    aside { border-right: 1px solid var(--line); background: var(--panel); padding: 24px 16px; position: sticky; top: 0; height: 100vh; overflow: auto; }
    .brand { padding: 0 10px 20px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
    .brand h1 { font-size: 18px; margin: 0 0 3px; }
    .brand p { color: var(--muted); font-size: 12px; margin: 0; }
    .search { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; outline: none; }
    .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .graph { margin-top: 18px; }
    .graph-title { color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 0 10px 6px; }
    .page-link { background: transparent; border: 0; border-radius: 5px; color: var(--text); cursor: pointer; display: block; padding: 6px 10px; text-align: left; width: 100%; }
    .page-link:hover, .page-link.active { background: var(--accent-soft); color: var(--accent); }
    .empty { color: var(--muted); padding: 12px 10px; font-size: 13px; }
    main { min-width: 0; }
    .topbar { align-items: center; border-bottom: 1px solid var(--line); background: rgba(247,248,250,.92); display: flex; gap: 12px; justify-content: space-between; padding: 15px clamp(20px, 5vw, 72px); position: sticky; top: 0; z-index: 2; backdrop-filter: blur(10px); }
    .crumb { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .updated { color: var(--muted); font-size: 12px; white-space: nowrap; }
    article { background: var(--panel); margin: 38px auto; max-width: 900px; min-height: calc(100vh - 120px); padding: clamp(24px, 5vw, 64px); }
    article h2 { font-size: clamp(26px, 4vw, 38px); line-height: 1.25; margin: 0 0 28px; }
    .block-list { list-style: none; margin: 0; padding: 0; }
    .block-list .block-list { margin-left: 24px; }
    .block { border-left: 2px solid transparent; margin: 5px 0; padding: 2px 0 2px 14px; }
    .block:hover { border-left-color: #bfdbfe; }
    .block-content { overflow-wrap: anywhere; white-space: pre-wrap; }
    .block-content code { background: #f2f4f7; border-radius: 4px; padding: 1px 5px; }
    .block-content a { color: var(--accent); text-decoration: none; }
    .block-content a:hover { text-decoration: underline; }
    .block-content img { border: 1px solid var(--line); border-radius: 5px; display: block; max-height: 520px; max-width: 100%; margin: 10px 0; object-fit: contain; }
    .welcome { color: var(--muted); }
    @media (max-width: 760px) { .app { display: block; } aside { height: auto; position: static; } .page-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); } article { margin: 0; min-height: calc(100vh - 170px); } .updated { display: none; } }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand"><h1>Logseq Knowledge Base</h1><p>Read-only snapshot</p></div>
      <input id="search" class="search" type="search" placeholder="搜索页面">
      <div id="navigation"></div>
    </aside>
    <main>
      <div class="topbar"><div id="crumb" class="crumb">选择一个页面</div><div id="updated" class="updated"></div></div>
      <article id="article"><p class="welcome">从左侧选择一个页面开始浏览。</p></article>
    </main>
  </div>
  <script>
    const state = { data: null, pages: [], pageMap: new Map() };

    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    const pageKey = (graph, title) => `${graph}::${String(title).trim().toLowerCase()}`;
    const slug = (value) => String(value).trim().toLowerCase().replace(/[^\p{Letter}\p{Number}]+/gu, '-').replace(/^-+|-+$/g, '') || 'page';

    function inlineMarkup(value, graph) {
      let html = escapeHtml(value);
      html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_, alt, source) => `<img src="assets/${source.split('/').pop()}" alt="${alt}">`);
      html = html.replace(/\[\[([^\]]+)\]\]/g, (_, title) => {
        const target = title.split('|')[0].trim();
        const page = state.pageMap.get(pageKey(graph, target));
        return page ? `<a href="#/${graph}/${page.slug}">${escapeHtml(target)}</a>` : escapeHtml(target);
      });
      html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      return html;
    }

    function renderBlock(block, graph) {
      const children = block['block/children'] || [];
      const content = block['block/title'] || '';
      return `<li class="block"><div class="block-content">${inlineMarkup(content, graph)}</div>${children.length ? `<ul class="block-list">${children.map((child) => renderBlock(child, graph)).join('')}</ul>` : ''}</li>`;
    }

    function renderNavigation(filter = '') {
      const needle = filter.trim().toLowerCase();
      const groups = state.data.graphs.map((graph) => {
        const pages = graph.pages.filter((page) => !needle || page.title.toLowerCase().includes(needle));
        if (!pages.length) return '';
        return `<section class="graph"><div class="graph-title">${escapeHtml(graph.name)}</div><div class="page-list">${pages.map((page) => `<button class="page-link" data-href="#/${graph.key}/${slug(page.title)}">${escapeHtml(page.title)}</button>`).join('')}</div></section>`;
      }).join('');
      document.querySelector('#navigation').innerHTML = groups || '<div class="empty">没有匹配的页面</div>';
      document.querySelectorAll('[data-href]').forEach((button) => button.addEventListener('click', () => { location.hash = button.dataset.href.slice(1); }));
      markActive();
    }

    function markActive() {
      const current = location.hash;
      document.querySelectorAll('.page-link').forEach((button) => button.classList.toggle('active', button.dataset.href === current));
    }

    function showPage(graphKey, pageSlug) {
      const page = state.pages.find((item) => item.graph === graphKey && item.slug === pageSlug);
      if (!page) return;
      document.querySelector('#crumb').textContent = `${page.graphName} / ${page.title}`;
      document.querySelector('#updated').textContent = `Snapshot: ${new Date(state.data.generatedAt).toLocaleDateString()}`;
      document.querySelector('#article').innerHTML = `<h2>${escapeHtml(page.title)}</h2><ul class="block-list">${(page.tree['block/children'] || []).map((block) => renderBlock(block, page.graph)).join('')}</ul>`;
      markActive();
      window.scrollTo(0, 0);
    }

    async function boot() {
      state.data = await fetch('data.json').then((response) => response.json());
      state.data.graphs.forEach((graph) => graph.pages.forEach((page) => {
        const item = { ...page, graph: graph.key, graphName: graph.name, slug: slug(page.title) };
        state.pages.push(item);
        state.pageMap.set(pageKey(graph.key, page.title), item);
      }));
      renderNavigation();
      document.querySelector('#search').addEventListener('input', (event) => renderNavigation(event.target.value));
      window.addEventListener('hashchange', () => {
        const [graphKey, pageSlug] = location.hash.replace(/^#\/?/, '').split('/');
        if (graphKey && pageSlug) showPage(graphKey, pageSlug);
      });
      const [graphKey, pageSlug] = location.hash.replace(/^#\/?/, '').split('/');
      if (graphKey && pageSlug) showPage(graphKey, pageSlug);
    }

    boot().catch((error) => { document.querySelector('#article').innerHTML = `<p class="welcome">无法加载站点数据：${escapeHtml(error.message)}</p>`; });
  </script>
</body>
</html>
